name: Publish AnNha Pi
on:
  push:
    tags: ['annha-pi-v*']
permissions:
  contents: write
concurrency:
  group: annha-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    environment: annha-pi-release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package and sign
        env:
          SIGNING_KEY: ${{ secrets.DEVICE_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY"
          python3 fall_detect/update/package_release.py "${GITHUB_REF_NAME#annha-pi-v}" "$GITHUB_SHA" "$RUNNER_TEMP/annha-release"
          umask 077
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key"
          openssl pkeyutl -sign -rawin -inkey "$key" -in "$RUNNER_TEMP/annha-release/manifest.json" -out "$RUNNER_TEMP/annha-release/manifest.sig"
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A published release remains immutable. Retry only an incomplete draft.
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft > "$RUNNER_TEMP/is-draft"; then
            test "$(cat "$RUNNER_TEMP/is-draft")" = true
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/annha-release/manifest.json" "$RUNNER_TEMP/annha-release/manifest.sig" "$RUNNER_TEMP/annha-release/annha-pi.tar.gz" --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
