; Cấu hình hỗ trợ cả VSCode PlatformIO, Arduino IDE và arduino-cli
[platformio]
src_dir = .
include_dir = .

[env:nanoatmega328new]
platform = atmelavr
board = nanoatmega328new
framework = arduino
monitor_speed = 115200
lib_deps =
  arduino-libraries/Servo@^1.2.2
  adafruit/DHT sensor library@^1.4.6
  adafruit/Adafruit Unified Sensor@^1.1.14

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_deps =
  arduino-libraries/Servo@^1.2.2
  adafruit/DHT sensor library@^1.4.6
  adafruit/Adafruit Unified Sensor@^1.1.14
